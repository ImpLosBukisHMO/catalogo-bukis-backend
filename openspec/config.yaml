project: catalogo-bukis

context: |
  Monorepo with two independent sub-repositories:
  - catalogo-bukis-frontend: React 19 + Vite 7 + TypeScript 5.9 + React Router 7 + TanStack Query 5 + Radix UI + Tailwind CSS 4 + Bulma 1.0
  - catalogo-bukis-backend: Django 6 + DRF 3.16 + SimpleJWT 5.5 + PostgreSQL (prod/CI) / SQLite (dev)
  Both repos deploy independently to Railway. Frontend: SPA, no SSR. Backend: REST API only.
  Auth: JWT (SimpleJWT). Image uploads via Pillow + Railway Volume (MEDIA_ROOT).
  Branching: feature → staging → main. CI on GitHub Actions for both repos.

persistence:
  mode: openspec
  engram_project: catalogo-bukis

execution:
  mode: interactive
  delivery_strategy: auto-forecast
  review_budget_lines: 800
  chain_strategy: pending

strict_tdd: true

testing:
  frontend:
    runner: vitest
    framework: vitest
    note: >
      Vitest 3.2.6 installed (devDependencies). package.json "test": "vitest run".
      11 existing .test.tsx files confirmed. Updated from runner: none as part of
      recibo-pdf-pedidos change (2026-08-17) — config was stale since 2026-06-14.
      Current lint status: 7 warnings (0 errors) — react-hooks/exhaustive-deps in SearchProductsPage.tsx.
      TypeScript: tsc -b passes with 0 errors.
    strict_tdd_override: false
    layers:
      unit: false
      integration: false
      e2e: false
    coverage: false
    commands:
      lint: "npm run lint"                        # 7 warnings, 0 errors (as of 2026-06-14)
      type_check: "npx tsc -b --noEmit"           # passes clean
      build: "npm run build"                      # tsc -b && vite build
    quality:
      linter: "npm run lint"
      type_checker: "tsc -b"
      formatter: null
  backend:
    runner: "python manage.py test"
    framework: django.test.TestCase
    strict_tdd: true
    local_runnable: true
    local_notes: >
      Tests run locally with SQLite fallback (DATABASE_URL env var not set → uses db.sqlite3).
      Activate venv first: source catalogo-bukis-backend/venv/bin/activate
      Run from: catalogo-bukis-backend/catalogo_backend/
      Full local command: DATABASE_URL="sqlite:///db.sqlite3" python manage.py test api.tests
      Concurrency tests (test_stock.py — task 1.2/1.5/1.6 — select_for_update) require Postgres
      because SQLite does not support SELECT FOR UPDATE; decorate with
      @skipUnlessDBFeature('has_select_for_update') — they will be skipped locally and
      run in CI only (postgres:16 service spun up in ci.yml).
    layers:
      unit: true          # api/tests/ — serializer-level and model-level unit tests
      integration: true   # Django TestCase spins up real DB (SQLite local, Postgres CI)
      concurrency: true   # select_for_update tests — CI-only (Postgres required)
      e2e: false
    coverage: false        # pytest-cov not installed; add: pip install pytest-cov
    test_files:
      current: "catalogo_backend/api/tests.py"      # 11 tests (WorkerCambiarEstadoSerializerTest)
      target:  "catalogo_backend/api/tests/"        # migrated in task 1.1
      post_migration:
        - "api/tests/test_order_state.py"           # moved from tests.py
        - "api/tests/test_stock.py"                 # new — PR1-BE tasks 1.2–1.6
        - "api/tests/test_images.py"                # new — PR2-BE task 2.3
        - "api/tests/test_pricing.py"               # new — PR3-BE tasks 3.1/3.8/3.9
        - "api/tests/test_availability.py"          # new — PR4-BE tasks 5.1/5.4
        - "api/tests/test_item_unique.py"           # new — PR5-BE tasks 7.1/7.5
    quality:
      linter: null         # no flake8/ruff in requirements.txt
      type_checker: null   # no mypy in requirements.txt
      formatter: null      # no black in requirements.txt
      static_check: "python manage.py check --deploy"
    commands:
      local_all:   "DATABASE_URL='sqlite:///db.sqlite3' python manage.py test api.tests"
      local_pr1:   "DATABASE_URL='sqlite:///db.sqlite3' python manage.py test api.tests.test_stock"
      ci_all:      "python manage.py test"          # runs from catalogo_backend/; Postgres via DATABASE_URL
      ci_pr1:      "python manage.py test api.tests.test_stock"
    ci_command: "python manage.py test"
    ci_context: "catalogo_backend/"
    ci_db: "postgresql://testuser:testpass@localhost:5432/testdb (postgres:16 service in ci.yml)"

